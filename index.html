<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
</head>
<body>
<center>
  <form>
    <h2>Your Information</h2>
    <h3>Your Name</h3>
    <input type="text" placeholder="Enter your name">
    <h3>Your Number</h3>
    <input type="text" placeholder="Enter your number">
    <h3>Your Email</h3>
    <input type="email" placeholder="Enter your email">
    <h3>Password</h3>
    <input type="password" placeholder="Enter your password">
    <h3>Your Date of Birth</h3>
    <input type="date" placeholder="Enter your date of birth">
    <h3>Your Gender</h3>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <h3>Your Hobby</h3>
    <input type="checkbox" name="hobby"> Reading
    <input type="checkbox" name="hobby"> Traveling
    <input type="checkbox" name="hobby"> Cooking
    <h3>Your Favourite Color</h3>
    <input type="color" name="color">
    <h3>Your Country</h3>
    <select>
      <option>BD</option>
      <option>USA</option>
      <option>UK</option>
      <option>Canada</option>
      <option>Australia</option>
    </select>
    <h3>Your Favourite Photo</h3>
    <input type="file">
    <h3>Your Address</h3>
    <textarea placeholder="Enter your address"></textarea>
    <button>Submit</button>
  </form>
<br><br>
<style>
  h1 {
    color: aquamarine;
  }
</style>
<h1>Thank You</h1>
<h2  style="color: tomato;"> For Submitting the Form</h2>
  </center>
</body>
</html>
